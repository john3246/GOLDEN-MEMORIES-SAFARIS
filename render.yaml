# IMPORTANT: this must be a Node Web Service, not a Static Site.
# A Static Site can show /cms/ but login 404s (no /api).
#
# Dashboard for golden-memories-safaris-2 (or a new Web Service):
#   Environment: Node
#   Build command: npm install --include=dev && npm run build:render
#   Start command: npm start
#   Health check: /health
# Then open https://<this-service>.onrender.com/cms/
services:
  - type: web
    name: golden-memories-safaris-api
    runtime: node
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: SERVE_PUBLIC
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PASSWORD
        value: unused-file-store
      - key: CMS_SEED_SAFARIS
        value: 'true'
      - key: CMS_ADMIN_EMAIL
        value: admin@gmsafaris.com
      - key: CMS_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS_CMS
        value: https://golden-memories-safaris-2.onrender.com
      - key: CORS_ORIGINS_WEBSITE
        value: https://golden-memories-safaris-2.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://golden-memories-safaris-2.onrender.com
