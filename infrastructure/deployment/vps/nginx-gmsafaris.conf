# /etc/nginx/sites-available/gmsafaris
# Node (website + CMS at /cms/ + API) listens on 127.0.0.1:3000.
# Certbot adds the HTTPS server block and the HTTP→HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name gmsafaris.com www.gmsafaris.com 199.192.27.42;

    # Photo uploads from the CMS
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # The app sets its own cache headers (HTML revalidates, assets are
        # fingerprinted), so nginx must not cache: CMS changes show at once.
        proxy_buffering on;
    }
}
